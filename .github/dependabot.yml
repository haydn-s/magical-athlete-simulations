# Weekly dependency updates, grouped so each week is at most a couple of PRs.
# CI runs on every one, so a green PR is safe to merge. The Python code has no
# dependencies (standard library only), so only the web app and Actions are listed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node's type definitions should match the Node version CI runs (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
